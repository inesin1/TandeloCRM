services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tandelo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}
      POSTGRES_DB: tandelo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tandelo -d tandelo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.vps}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.vps}
      COPILOT_ENABLED: ${COPILOT_ENABLED:-false}
      COPILOT_API_FORMAT: ${COPILOT_API_FORMAT:-}
      COPILOT_BASE_URL: ${COPILOT_BASE_URL:-}
      COPILOT_API_KEY: ${COPILOT_API_KEY:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3103}:8080"

  tooling:
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
    profiles: [tools]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.vps}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
