<p-sidebar-layout class="h-dvh">
  <p-sidebar
    id="app-sidebar"
    variant="floating"
    collapsible="icon"
    side="left"
    iconWidth="3.75rem"
  >
    <p-sidebar-spacer />
    <p-sidebar-aside>
      <p-sidebar-panel>
        <p-sidebar-header>
          <p-sidebar-menu>
            <p-sidebar-menu-item>
              <button pSidebarMenuButton routerLink="/">
                <app-logo />
                <span class="font-semibold text-sm">{{ title }}</span>
              </button>
            </p-sidebar-menu-item>
          </p-sidebar-menu>
        </p-sidebar-header>
        <p-sidebar-content>
          <p-sidebar-group>
            <p-sidebar-menu>
              @for (item of navItems; track item.label) {
              <p-sidebar-menu-item>
                <button
                  pSidebarMenuButton
                  [routerLink]="item.routerLink"
                  routerLinkActive
                  #rla="routerLinkActive"
                  [isActive]="rla.isActive"
                >
                  <svg [pIcon]="item.icon"></svg>
                  <span>{{ item.label }}</span>
                </button>
                @if (item.badge) {
                <p-sidebar-menu-badge>{{ item.badge }}</p-sidebar-menu-badge>
                }
              </p-sidebar-menu-item>
              }
            </p-sidebar-menu>
          </p-sidebar-group>
        </p-sidebar-content>
        <p-sidebar-footer>
          <p-sidebar-menu>
            <p-sidebar-menu-item>
              <button pSidebarMenuButton>
                <p-avatar
                  label="JD"
                  shape="circle"
                  class="size-6 shrink-0 text-xs"
                />
                <span>John Doe</span>
              </button>
            </p-sidebar-menu-item>
          </p-sidebar-menu>
        </p-sidebar-footer>
        <button pSidebarRail aria-label="Toggle sidebar"></button>
      </p-sidebar-panel>
    </p-sidebar-aside>
  </p-sidebar>

  <p-sidebar-main>
    <header
      class="m-2 mb-0 flex h-12 shrink-0 items-center gap-2 rounded-xl border border-[var(--p-content-border-color)] bg-[var(--p-content-background)] px-2 shadow-sm"
    >
      <button
        pButton
        pSidebarTrigger
        target="app-sidebar"
        severity="secondary"
        text
        size="small"
      >
        <svg data-p-icon="sidebar"></svg>
      </button>
    </header>

    <main class="flex-1 overflow-y-auto p-2">
      <router-outlet />
    </main>

  </p-sidebar-main>
</p-sidebar-layout>
