<p-sidebar-layout class="h-dvh">
  <p-sidebar
    id="app-sidebar"
    variant="floating"
    collapsible="icon"
    side="left"
    iconWidth="3.75rem"
  >
    <p-sidebar-spacer />
    <p-sidebar-aside>
      <p-sidebar-panel>
        <p-sidebar-header>
          <p-sidebar-menu>
            <p-sidebar-menu-item>
              <button pSidebarMenuButton routerLink="/">
                <app-logo />
                <span class="font-semibold text-sm">{{ title }}</span>
              </button>
            </p-sidebar-menu-item>
          </p-sidebar-menu>
        </p-sidebar-header>
        <p-sidebar-content>
          <p-sidebar-group>
            <p-sidebar-menu>
              @for (item of navItems; track item.label) {
              <p-sidebar-menu-item>
                <button
                  pSidebarMenuButton
                  [routerLink]="item.routerLink"
                  routerLinkActive
                  #rla="routerLinkActive"
                  [isActive]="rla.isActive"
                >
                  <svg [pIcon]="item.icon"></svg>
                  <span>{{ item.label }}</span>
                </button>
                @if (item.badge) {
                <p-sidebar-menu-badge>{{ item.badge }}</p-sidebar-menu-badge>
                }
              </p-sidebar-menu-item>
              }
            </p-sidebar-menu>
          </p-sidebar-group>
        </p-sidebar-content>
        <p-sidebar-footer>
          <p-sidebar-menu>
            <p-sidebar-menu-item>
              <button pSidebarMenuButton>
                <p-avatar
                  label="JD"
                  shape="circle"
                  class="size-6 shrink-0 text-xs"
                />
                <span>John Doe</span>
              </button>
            </p-sidebar-menu-item>
          </p-sidebar-menu>
        </p-sidebar-footer>
        <button pSidebarRail aria-label="Toggle sidebar"></button>
      </p-sidebar-panel>
    </p-sidebar-aside>
  </p-sidebar>

  <p-sidebar-main class="min-w-0">
    <main class="min-w-0 flex-1 overflow-y-auto py-4 pr-4">
      <router-outlet />
    </main>
  </p-sidebar-main>

  <app-copilot-panel />
</p-sidebar-layout>
