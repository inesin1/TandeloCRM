@if(authApi.isAuthenticated()) {
<p-sidebar-layout class="app-shell h-dvh overflow-x-clip">
  <p-sidebar
    id="app-sidebar"
    variant="floating"
    collapsible="icon"
    side="left"
    iconWidth="3.75rem"
    [open]="false"
  >
    <p-sidebar-spacer />
    <p-sidebar-aside>
      <p-sidebar-panel class="app-sidebar-panel">
        <p-sidebar-header>
          <p-sidebar-menu>
            <p-sidebar-menu-item>
              <button
                pSidebarMenuButton
                routerLink="/"
                [pTooltip]="title"
                tooltipPosition="right"
              >
                <app-logo />
                <span class="font-semibold text-sm">{{ title }}</span>
              </button>
            </p-sidebar-menu-item>
          </p-sidebar-menu>
        </p-sidebar-header>
        <p-sidebar-content>
          <p-sidebar-group>
            <p-sidebar-menu>
              @for (item of navItems; track item.label) {
              <p-sidebar-menu-item>
                <button
                  pSidebarMenuButton
                  [routerLink]="item.routerLink"
                  routerLinkActive
                  #rla="routerLinkActive"
                  [isActive]="rla.isActive"
                  [class.app-nav-active]="rla.isActive"
                  [pTooltip]="item.label"
                  tooltipPosition="right"
                >
                  <svg [pIcon]="item.icon"></svg>
                  <span>{{ item.label }}</span>
                </button>
                @if (item.badge) {
                <p-sidebar-menu-badge>{{ item.badge }}</p-sidebar-menu-badge>
                }
              </p-sidebar-menu-item>
              }
            </p-sidebar-menu>
          </p-sidebar-group>
        </p-sidebar-content>
        @if (!resetDemo) {
        <p-sidebar-footer>
          <p-sidebar-menu>
            <p-sidebar-menu-item>
              <button
                type="button"
                pSidebarMenuButton
                [pTooltip]="
                  authApi.session.hasValue() ? authApi.session.value().user.name : ''
                "
                tooltipPosition="right"
                (click)="logout()"
              >
                <svg [pIcon]="'sign-out'"></svg>
                <span>Sign out</span>
              </button>
            </p-sidebar-menu-item>
          </p-sidebar-menu>
        </p-sidebar-footer>
        }
      </p-sidebar-panel>
    </p-sidebar-aside>
  </p-sidebar>

  <p-sidebar-main class="app-main min-w-0">
    <main class="app-content min-w-0 flex-1 overflow-y-auto p-2">
      @if (resetDemo; as reset) {
      <div
        class="mb-2 flex flex-wrap items-center justify-between gap-2 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-sm text-emerald-900"
      >
        <span>Interactive demo · Changes stay in this browser</span>
        <button
          type="button"
          class="rounded px-2 py-1 font-semibold underline hover:bg-emerald-100"
          (click)="reset()"
        >
          Reset demo
        </button>
      </div>
      }
      <router-outlet />
    </main>
  </p-sidebar-main>
</p-sidebar-layout>
<button
  type="button"
  class="copilot-launcher"
  aria-label="Open Copilot panel"
  aria-haspopup="dialog"
  [attr.aria-expanded]="copilot.panelOpen()"
  (click)="openCopilot($event)"
>
  <svg pIcon="sparkles" aria-hidden="true"></svg>
  Copilot
</button>
@defer (when copilot.panelOpen()) {
<p-drawer
  [visible]="copilot.panelOpen()"
  (visibleChange)="panelVisibilityChanged($event)"
  position="right"
  header="Copilot"
  ariaCloseLabel="Close Copilot"
  [modal]="true"
  [blockScroll]="true"
  [dismissible]="true"
  [closeOnEscape]="true"
  [style]="{ width: 'min(42rem, 100vw)', height: '100dvh' }"
>
  <app-copilot-chat
    [context]="copilot.panelContext()"
    (contextChange)="copilot.clearPanelContext()"
  />
</p-drawer>
} } @else {
<router-outlet />
}
