<div class="flex h-full flex-col">
  <div
    class="px-4 py-3 flex shrink-0 items-center justify-between gap-4 rounded-xl border border-[var(--p-content-border-color)] bg-[var(--p-content-background)] shadow-sm"
  >
    <div class="flex items-center gap-3">
      <h1 class="text-2xl font-semibold tracking-tight text-surface-800">
        Companies
      </h1>
      <span class="text-lg text-surface-400">{{ total }}</span>
    </div>

    <div class="flex items-center gap-2">
      <button pButton severity="secondary" outlined>
        <svg [pIcon]="'upload'"></svg>
        <span>Import</span>
      </button>

      <button pButton>
        <svg data-p-icon="plus"></svg>
        <span>Company</span>
      </button>
    </div>
  </div>

  <div
    class="mt-4 flex min-h-0 flex-1 flex-col rounded-xl border border-surface-200 bg-[var(--p-content-background)]"
  >
    <div class="flex shrink-0 flex-wrap items-center gap-2 p-4">
      <p-iconfield class="w-64">
        <p-inputicon>
          <svg [pIcon]="'search'"></svg>
        </p-inputicon>
        <input
          pInputText
          type="search"
          size="small"
          class="w-full"
          placeholder="Name, email or phone"
          [ngModel]="search()"
          (ngModelChange)="search.set($event)"
        />
      </p-iconfield>

      <p-select
        [options]="users"
        [ngModel]="responsibleFilter()"
        (ngModelChange)="responsibleFilter.set($event)"
        optionLabel="name"
        optionValue="id"
        placeholder="Responsible"
        showClear
        class="w-48"
      />

      <button pButton severity="secondary" outlined disabled>
        <svg [pIcon]="'filter'"></svg>
        <span>Filter</span>
      </button>
    </div>

    <p-table
      [value]="rows()"
      [(selection)]="selectedCompanies"
      dataKey="id"
      removableSort
      showGridlines
      [tableStyle]="{ 'min-width': '50rem' }"
      class="min-h-0 flex-1 overflow-auto"
    >
      <ng-template #header>
        <tr>
          <th style="width: 3rem">
            <p-table-header-checkbox />
          </th>
          <th pSortableColumn="name">
            <div class="flex items-center gap-2">
              Name
              <p-sort-icon field="name" />
            </div>
          </th>
          <th>Contact info</th>
          <th>Responsible</th>
        </tr>
      </ng-template>

      <ng-template #body let-company>
        <tr>
          <td>
            <p-table-checkbox [value]="company" />
          </td>

          <td>
            <div class="text-sm font-medium text-surface-900">
              {{ company.name }}
            </div>
            <div
              class="mt-0.5 flex items-center gap-1.5 text-xs text-surface-500"
            >
              <span class="truncate">{{ company.industry }}</span>
              <span aria-hidden="true">·</span>
              <span class="truncate">{{ company.address }}</span>
            </div>
          </td>

          <td>
            <div class="flex items-center gap-1.5 text-sm text-surface-700">
              <svg [pIcon]="'envelope'" class="size-3.5 shrink-0"></svg>
              <span class="truncate">{{ company.email }}</span>
            </div>
            <div
              class="mt-0.5 flex items-center gap-1.5 text-sm text-surface-700"
            >
              <svg [pIcon]="'phone'" class="size-3.5 shrink-0"></svg>
              <span class="truncate">{{ company.phone }}</span>
            </div>
          </td>

          <td>
            <div class="flex items-center gap-2 whitespace-nowrap text-sm">
              <span
                class="flex size-6 shrink-0 items-center justify-center rounded-full bg-surface-100"
              >
                <svg [pIcon]="'user'" class="size-3.5"></svg>
              </span>
              {{ company.responsibleName }}
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
