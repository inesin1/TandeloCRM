name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tandelo_e2e
          POSTGRES_USER: tandelo
          POSTGRES_PASSWORD: tandelo-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tandelo -d tandelo_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check release version consistency
        run: >-
          node -e "require('node:assert/strict').equal(require('./package.json').version,
          require('./.release-please-manifest.json')['.'])"

      - run: pnpm nx run-many -t lint typecheck test build

      - name: Run API E2E against PostgreSQL
        env:
          API_E2E_DATABASE_URL: postgresql://tandelo:tandelo-e2e@127.0.0.1:5432/tandelo_e2e
          API_E2E_ADMIN_EMAIL: admin@example.test
          API_E2E_ADMIN_PASSWORD: tandelo-e2e-admin
        run: |
          export DATABASE_URL="$API_E2E_DATABASE_URL"
          export ADMIN_EMAIL="$API_E2E_ADMIN_EMAIL"
          export ADMIN_PASSWORD="$API_E2E_ADMIN_PASSWORD"
          pnpm db:migrate
          pnpm db:seed-admin
          pnpm nx run api-e2e:e2e

      - run: pnpm exec playwright install --with-deps
      - run: pnpm nx run web-e2e:e2e

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    steps:
      - uses: googleapis/release-please-action@v5
