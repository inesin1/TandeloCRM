name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check release version consistency
        run: >-
          node -e "require('node:assert/strict').equal(require('./package.json').version,
          require('./.release-please-manifest.json')['.'])"

      - run: pnpm nx run-many -t lint test build

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    steps:
      - uses: googleapis/release-please-action@v4
